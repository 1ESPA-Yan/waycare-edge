# /etc/nginx/sites-available/waycare
# Proxy reverso: HTTPS publico -> backend Flask em localhost:5000
# Troque o server_name pelo seu dominio DuckDNS.
#
# Instalacao:
#   sudo cp waycare-nginx.conf /etc/nginx/sites-available/waycare
#   sudo ln -s /etc/nginx/sites-available/waycare /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d waycare-fiap.duckdns.org
#
# O certbot edita este arquivo sozinho, adicionando o bloco ssl (443) e
# o redirect de 80->443. Voce so precisa garantir o proxy_pass abaixo.

server {
    listen 80;
    server_name waycare-fiap.duckdns.org;

    location / {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
